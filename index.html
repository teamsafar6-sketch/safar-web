<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAFAR | سفر — Flights & Travel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --navy: #0A2239; --gold: #B08748; }
    body { background-color: #F4F6F9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .bg-navy { background-color: var(--navy); }
    .text-navy { color: var(--navy); }
    .bg-gold { background-color: var(--gold); }
    .text-gold { color: var(--gold); }
    .border-gold { border-color: var(--gold); }
  </style>
</head>
<body class="text-slate-800">

  <!-- TOP NAVBAR -->
  <header class="bg-navy text-white shadow-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gold flex items-center justify-center font-bold text-navy text-xl shadow">✈</div>
        <div>
          <span class="font-bold text-xl tracking-wide">SAFAR</span>
          <span class="text-gold font-semibold text-lg ml-1">سفر</span>
        </div>
      </div>
      <div class="flex items-center gap-3 text-sm">
        <select id="currencySelect" onchange="renderResults()" class="bg-slate-800 border border-slate-600 rounded-lg px-2.5 py-1.5 text-white">
          <option value="USD">USD ($)</option>
          <option value="AFN">AFN (؋)</option>
        </select>
        <button onclick="openMyBookings()" class="bg-gold text-navy font-semibold px-3.5 py-1.5 rounded-lg hover:opacity-90">
          My Bookings
        </button>
      </div>
    </div>
  </header>

  <!-- HERO & SEARCH BOX -->
  <section class="bg-navy text-white pt-8 pb-16 px-4">
    <div class="max-w-5xl mx-auto">
      <h1 class="text-2xl md:text-4xl font-bold mb-2">Your Journey, Simplified.</h1>
      <p class="text-slate-300 text-sm md:text-base mb-6">Book domestic Afghan &amp; international flights — pay via HesabPay, M-Paisa, or Bank Transfer.</p>

      <!-- SEARCH CARD -->
      <div class="bg-white text-slate-800 rounded-2xl shadow-xl p-5 md:p-6">
        <div class="flex flex-wrap items-center gap-4 mb-4 text-sm font-medium">
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="radio" name="tripType" value="oneway" checked onchange="toggleReturnDate()" class="accent-[#0A2239]" /> One-way
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="radio" name="tripType" value="roundtrip" onchange="toggleReturnDate()" class="accent-[#0A2239]" /> Round-trip
          </label>
          <select id="cabinClass" class="ml-auto border rounded-lg px-3 py-1 text-slate-700">
            <option value="economy">Economy</option>
            <option value="premium">Premium Economy</option>
            <option value="business">Business</option>
            <option value="first">First</option>
          </select>
          <select id="adults" class="border rounded-lg px-3 py-1 text-slate-700">
            <option value="1">1 Adult</option>
            <option value="2">2 Adults</option>
            <option value="3">3 Adults</option>
            <option value="4">4 Adults</option>
          </select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-5 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">From</label>
            <input id="origin" list="airports" value="KBL" placeholder="KBL, DXB, IST..." class="w-full border border-slate-300 rounded-xl px-3 py-2.5 font-semibold uppercase focus:outline-none focus:border-gold" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">To</label>
            <input id="destination" list="airports" value="DXB" placeholder="DXB, HEA, MZR..." class="w-full border border-slate-300 rounded-xl px-3 py-2.5 font-semibold uppercase focus:outline-none focus:border-gold" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Departure</label>
            <input id="departureDate" type="date" class="w-full border border-slate-300 rounded-xl px-3 py-2.5 font-medium" />
          </div>
          <div id="returnDateWrap" class="opacity-40 pointer-events-none">
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Return</label>
            <input id="returnDate" type="date" class="w-full border border-slate-300 rounded-xl px-3 py-2.5 font-medium" />
          </div>
          <div class="flex items-end">
            <button onclick="searchFlights()" id="searchBtn" class="w-full bg-gold text-navy font-bold py-3 rounded-xl hover:opacity-95 shadow-md transition">
              Search Flights
            </button>
          </div>
        </div>

        <datalist id="airports">
          <option value="KBL">Kabul (KBL) - Afghanistan</option>
          <option value="HEA">Herat (HEA) - Afghanistan</option>
          <option value="MZR">Mazar-i-Sharif (MZR) - Afghanistan</option>
          <option value="KDH">Kandahar (KDH) - Afghanistan</option>
          <option value="DXB">Dubai (DXB) - UAE</option>
          <option value="IST">Istanbul (IST) - Turkey</option>
          <option value="DEL">New Delhi (DEL) - India</option>
          <option value="ISB">Islamabad (ISB) - Pakistan</option>
          <option value="LHR">London Heathrow (LHR) - UK</option>
        </datalist>
      </div>
    </div>
  </section>

  <!-- RESULTS SECTION -->
  <main class="max-w-5xl mx-auto px-4 -mt-8 pb-16">
    <div id="statusBanner" class="hidden bg-white rounded-xl p-4 shadow mb-4 text-center font-medium text-navy"></div>
    <div id="resultsList" class="space-y-4"></div>
  </main>

  <!-- BOOKING & AI PASSPORT MODAL -->
  <div id="bookingModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative my-8">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 text-xl font-bold">&times;</button>
      <h2 class="text-xl font-bold text-navy mb-1">Complete Your Booking</h2>
      <p id="modalFlightSummary" class="text-sm text-slate-500 mb-4"></p>

      <!-- AI MRZ Auto-Fill -->
      <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 mb-4">
        <label class="block text-xs font-bold text-navy mb-1">⚡ AI Passport Auto-Fill (Paste Passport MRZ Line)</label>
        <div class="flex gap-2">
          <input id="mrzInput" type="text" placeholder="P<AFGAHMADI<<ZAHRA<<<<..." class="flex-1 text-xs border rounded-lg px-2.5 py-1.5" />
          <button type="button" onclick="autoFillPassport()" id="mrzBtn" class="bg-navy text-white text-xs font-semibold px-3 py-1.5 rounded-lg">Auto-Fill</button>
        </div>
      </div>

      <form id="bookingForm" onsubmit="submitBooking(event)" class="space-y-3 text-sm">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold mb-1">Full Name (As in Passport)</label>
            <input id="paxName" required type="text" placeholder="ZAHRA AHMADI" class="w-full border rounded-lg px-3 py-2" />
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1">Passport / Tazkira No.</label>
            <input id="paxPassport" required type="text" placeholder="P098421124" class="w-full border rounded-lg px-3 py-2 uppercase" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold mb-1">WhatsApp / Phone</label>
            <input id="paxPhone" required type="tel" placeholder="+93 700 000 000" class="w-full border rounded-lg px-3 py-2" />
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1">Email</label>
            <input id="paxEmail" required type="email" placeholder="traveler@email.com" class="w-full border rounded-lg px-3 py-2" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold mb-1">Payment Method</label>
          <select id="paymentMethod" onchange="updatePaymentNote()" class="w-full border rounded-lg px-3 py-2 font-medium">
            <option value="hesabpay">HesabPay (Merchant ID: SAFAR-AF)</option>
            <option value="mpaisa">M-Paisa / Roshan Transfer</option>
            <option value="bank_transfer">Bank Transfer (AIB / Azizi Bank)</option>
          </select>
          <p id="paymentNote" class="text-xs text-slate-500 mt-1">Pay via HesabPay app using Merchant ID <strong>SAFAR-AF</strong> and share your receipt.</p>
        </div>

        <div>
          <label class="block text-xs font-semibold mb-1">Upload Payment Receipt (Optional now)</label>
          <input id="receiptFile" type="file" accept="image/*,.pdf" class="w-full text-xs border rounded-lg p-2" />
        </div>

        <button type="submit" id="confirmBookingBtn" class="w-full bg-gold text-navy font-bold py-3 rounded-xl shadow hover:opacity-95 mt-2">
          Confirm &amp; Reserve Ticket
        </button>
      </form>
    </div>
  </div>

  <!-- MY BOOKINGS MODAL -->
  <div id="bookingsModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative my-8">
      <button onclick="closeBookingsModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 text-xl font-bold">&times;</button>
      <h2 class="text-xl font-bold text-navy mb-2">Lookup Your Booking</h2>
      <div class="flex gap-2 mb-4">
        <input id="lookupRef" type="text" placeholder="Enter Booking Ref (e.g. SFR-AB12CD)" class="flex-1 border rounded-xl px-3 py-2 text-sm uppercase" />
        <button type="button" onclick="lookupBooking()" id="lookupBtn" class="bg-navy text-white text-sm font-semibold px-4 py-2 rounded-xl">Find</button>
      </div>
      <div id="lookupResult" class="text-sm text-slate-600"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://vbqandmzjpvifvmuzibh.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    const SAFAR_API_URL = `${SUPABASE_URL}/functions/v1/safar-api`;

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const AFN_RATE = 71;
    let currentOffers = [];
    let selectedFlight = null;

    const today = new Date().toISOString().split("T")[0];
    const nextWeek = new Date(Date.now() + 7 * 86400000).toISOString().split("T")[0];
    document.getElementById("departureDate").min = today;
    document.getElementById("departureDate").value = nextWeek;
    document.getElementById("returnDate").min = nextWeek;

    function toggleReturnDate() {
      const isRound = document.querySelector('input[name="tripType"]:checked').value === "roundtrip";
      const wrap = document.getElementById("returnDateWrap");
      wrap.classList.toggle("opacity-40", !isRound);
      wrap.classList.toggle("pointer-events-none", !isRound);
      if (isRound && !document.getElementById("returnDate").value) {
        document.getElementById("returnDate").value = new Date(Date.now() + 14 * 86400000).toISOString().split("T")[0];
      }
    }

    function updatePaymentNote() {
      const method = document.getElementById("paymentMethod").value;
      const note = document.getElementById("paymentNote");
      if (method === "hesabpay") {
        note.innerHTML = "Pay via HesabPay app using Merchant ID <strong>SAFAR-AF</strong> and attach/share your receipt.";
      } else if (method === "mpaisa") {
        note.innerHTML = "Send transfer via <strong>M-Paisa</strong> and include your booking reference in the note.";
      } else {
        note.innerHTML = "Transfer to <strong>AIB / Azizi Bank</strong> SAFAR account and upload your transfer slip.";
      }
    }

    function showStatus(msg) {
      const el = document.getElementById("statusBanner");
      el.textContent = msg;
      el.classList.remove("hidden");
    }

    async function searchFlights() {
      const origin = document.getElementById("origin").value.trim().toUpperCase();
      const destination = document.getElementById("destination").value.trim().toUpperCase();
      const departureDate = document.getElementById("departureDate").value;
      const returnDate = document.getElementById("returnDate").value;
      const tripType = document.querySelector('input[name="tripType"]:checked').value;
      const cabinClass = document.getElementById("cabinClass").value;
      const adults = parseInt(document.getElementById("adults").value, 10);

      if (!origin || !destination || !departureDate) {
        return showStatus("Please enter origin, destination, and departure date.");
      }
      if (tripType === "roundtrip" && returnDate && returnDate < departureDate) {
        return showStatus("Return date cannot be earlier than departure date.");
      }

      const btn = document.getElementById("searchBtn");
      btn.disabled = true;
      btn.textContent = "Searching...";
      showStatus(`Searching flights from ${origin} to ${destination}...`);
      currentOffers = [];

      try {
        const { data: localFlights, error: dbErr } = await db
          .from("scheduled_flights")
          .select("*")
          .eq("origin_code", origin)
          .eq("destination_code", destination);

        if (!dbErr && localFlights && localFlights.length > 0) {
          localFlights.forEach((f) => {
            currentOffers.push({
              id: f.id,
              airline: f.airline,
              code: f.flight_number,
              origin,
              destination,
              depTime: f.departure_time,
              arrTime: f.arrival_time,
              durationText: "1h 15m",
              stopLabel: "Non-Stop",
              groupTotalUsd: Number(f.price_usd) * adults,
              groupTotalAfn: Number(f.price_afn) * adults,
              source: "domestic",
            });
          });
        }

        const apiRes = await fetch(SAFAR_API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_ANON_KEY,
          },
          body: JSON.stringify({
            action: "search_flights",
            payload: { origin, destination, departureDate, returnDate, tripType, cabinClass, adults },
          }),
        });

        const apiData = await apiRes.json();
        if (apiData.offers && Array.isArray(apiData.offers)) {
          apiData.offers.forEach((o) => {
            currentOffers.push({
              ...o,
              origin,
              destination,
              groupTotalAfn: Math.round(o.groupTotalUsd * AFN_RATE),
            });
          });
        }

        if (currentOffers.length === 0) {
          showStatus(apiData.error
            ? `Search issue: ${apiData.error}. Try KBL → HEA or KBL → DXB.`
            : `No flights found for ${origin} → ${destination} on ${departureDate}. Try KBL → DXB or KBL → HEA.`);
        } else {
          document.getElementById("statusBanner").classList.add("hidden");
        }
        renderResults();
      } catch (err) {
        showStatus("Search error: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Search Flights";
      }
    }

    function renderResults() {
      const currency = document.getElementById("currencySelect").value;
      const list = document.getElementById("resultsList");
      list.innerHTML = "";

      currentOffers.forEach((flight, idx) => {
        const priceDisplay = currency === "AFN"
          ? `${Number(flight.groupTotalAfn).toLocaleString()} AFN`
          : `$${flight.groupTotalUsd} USD`;

        const badge = flight.source === "domestic"
          ? `<span class="bg-amber-100 text-amber-800 text-xs font-semibold px-2 py-0.5 rounded">Local Partner</span>`
          : `<span class="bg-sky-100 text-sky-800 text-xs font-semibold px-2 py-0.5 rounded">Instant Global</span>`;

        const returnRow = flight.retDepTime
          ? `<div class="flex items-center gap-4 text-xs text-slate-500 mt-1.5 pl-2 border-l-2 border-gold">
               <span>Return:</span>
               <span><strong>${flight.retDepTime}</strong> ${flight.destination}</span>
               <span>── ${flight.retDurationText || ""} ──</span>
               <span><strong>${flight.retArrTime || ""}</strong> ${flight.origin}</span>
             </div>`
          : "";

        list.innerHTML += `
          <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <div class="flex items-center gap-2 mb-1">
                <span class="font-bold text-navy text-lg">${flight.airline}</span>
                <span class="text-xs text-slate-400 font-mono">${flight.code}</span>
                ${badge}
              </div>
              <div class="flex items-center gap-4 text-sm text-slate-700 mt-2">
                <div><span class="font-bold text-base">${flight.depTime}</span> <span class="text-slate-500">${flight.origin}</span></div>
                <div class="text-xs text-slate-400">── ${flight.durationText} (${flight.stopLabel}) ──</div>
                <div><span class="font-bold text-base">${flight.arrTime}</span> <span class="text-slate-500">${flight.destination}</span></div>
              </div>
              ${returnRow}
            </div>
            <div class="flex md:flex-col items-center md:items-end justify-between border-t md:border-t-0 pt-3 md:pt-0">
              <div class="text-xl font-extrabold text-navy">${priceDisplay}</div>
              <button type="button" onclick="openBookingModal(${idx})" class="bg-navy text-white text-sm font-semibold px-5 py-2 rounded-xl hover:bg-slate-800 mt-1">
                Select Flight
              </button>
            </div>
          </div>
        `;
      });
    }

    function openBookingModal(index) {
      selectedFlight = currentOffers[index];
      const currency = document.getElementById("currencySelect").value;
      const priceText = currency === "AFN"
        ? `${Number(selectedFlight.groupTotalAfn).toLocaleString()} AFN`
        : `$${selectedFlight.groupTotalUsd} USD`;

      document.getElementById("modalFlightSummary").textContent =
        `${selectedFlight.airline} (${selectedFlight.code}) • ${selectedFlight.origin} → ${selectedFlight.destination} • ${priceText}`;
      document.getElementById("bookingModal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("bookingModal").classList.add("hidden");
    }

    async function autoFillPassport() {
      const mrz = document.getElementById("mrzInput").value.trim();
      const btn = document.getElementById("mrzBtn");
      btn.textContent = "Reading...";
      try {
        const res = await fetch(SAFAR_API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY },
          body: JSON.stringify({
            action: "parse_document",
            payload: { docType: "passport", rawText: mrz || undefined },
          }),
        });
        const data = await res.json();
        if (data.result) {
          document.getElementById("paxName").value = `${data.result.firstName || ""} ${data.result.lastName || ""}`.trim();
          document.getElementById("paxPassport").value = data.result.passportNumber || "";
        }
      } catch (e) {
        alert("Could not parse passport text: " + e.message);
      } finally {
        btn.textContent = "Auto-Fill";
      }
    }

    async function submitBooking(e) {
      e.preventDefault();
      if (!selectedFlight) return;

      const btn = document.getElementById("confirmBookingBtn");
      btn.disabled = true;
      btn.textContent = "Saving Booking...";

      const bookingRef = "SFR-" + Math.random().toString(36).substring(2, 8).toUpperCase();
      const currency = document.getElementById("currencySelect").value;
      const totalAmount = currency === "AFN" ? selectedFlight.groupTotalAfn : selectedFlight.groupTotalUsd;
      let receiptPath = null;

      const fileInput = document.getElementById("receiptFile");
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const fileName = `${bookingRef}-${file.name}`;
        const { data: uploadData, error: upErr } = await db.storage.from("receipts").upload(fileName, file);
        if (upErr) {
          alert("Receipt upload note: " + upErr.message);
        } else if (uploadData) {
          receiptPath = uploadData.path;
        }
      }

      const { error } = await db.from("bookings").insert([{
        booking_ref: bookingRef,
        passenger_name: document.getElementById("paxName").value.trim(),
        passenger_email: document.getElementById("paxEmail").value.trim(),
        passenger_phone: document.getElementById("paxPhone").value.trim(),
        passport_number: document.getElementById("paxPassport").value.trim().toUpperCase(),
        flight_source: selectedFlight.source,
        airline: selectedFlight.airline,
        flight_number: selectedFlight.code,
        route: `${selectedFlight.origin}-${selectedFlight.destination}`,
        travel_date: document.getElementById("departureDate").value,
        total_amount: totalAmount,
        currency,
        payment_method: document.getElementById("paymentMethod").value,
        receipt_url: receiptPath,
      }]);

      btn.disabled = false;
      btn.textContent = "Confirm & Reserve Ticket";

      if (error) {
        alert("Error saving booking: " + error.message);
      } else {
        document.getElementById("bookingForm").reset();
        closeModal();
        alert(`Booking Reserved! Reference: ${bookingRef}\nComplete payment via ${document.getElementById("paymentMethod").value.toUpperCase()} and keep ${bookingRef} to check status under My Bookings.`);
      }
    }

    function openMyBookings() {
      document.getElementById("lookupResult").innerHTML = "";
      document.getElementById("bookingsModal").classList.remove("hidden");
    }

    function closeBookingsModal() {
      document.getElementById("bookingsModal").classList.add("hidden");
    }

    async function lookupBooking() {
      const ref = document.getElementById("lookupRef").value.trim().toUpperCase();
      const box = document.getElementById("lookupResult");
      if (!ref) return;
      box.textContent = "Checking...";

      const { data, error } = await db
        .from("bookings")
        .select("booking_ref, passenger_name, airline, flight_number, route, travel_date, total_amount, currency, payment_status")
        .eq("booking_ref", ref)
        .maybeSingle();

      if (error || !data) {
        box.innerHTML = `<span class="text-red-600">No booking found for <strong>${ref}</strong>.</span>`;
        return;
      }

      box.innerHTML = `
        <div class="bg-slate-50 border rounded-xl p-3 space-y-1">
          <div><strong>Ref:</strong> ${data.booking_ref} • <strong>Status:</strong> <span class="uppercase font-semibold text-navy">${data.payment_status}</span></div>
          <div><strong>Passenger:</strong> ${data.passenger_name}</div>
          <div><strong>Flight:</strong> ${data.airline} (${data.flight_number}) — ${data.route} on ${data.travel_date}</div>
          <div><strong>Total:</strong> ${Number(data.total_amount).toLocaleString()} ${data.currency}</div>
        </div>
      `;
    }

    window.addEventListener("DOMContentLoaded", searchFlights);
  </script>
</body>
</html>
